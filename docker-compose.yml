# Full local stack: SQL Server + Kafka (KRaft) + API + Angular (nginx).
#   docker compose up --build
# UI: http://localhost:8081   API/Swagger: http://localhost:5000/swagger
services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "Your_strong_Passw0rd!"
    ports: ["1433:1433"]
    volumes: ["sqldata:/var/opt/mssql"]
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -Q 'SELECT 1' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 20s

  kafka:
    image: apache/kafka:3.8.0
    ports: ["9092:9092"]
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:19092,CONTROLLER://:9093,EXTERNAL://:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:19092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:19092 > /dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 20
      start_period: 15s

  api:
    build:
      context: .
      dockerfile: src/Claims.API/Dockerfile
    depends_on:
      sqlserver: { condition: service_healthy }
      kafka: { condition: service_healthy }
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      Database__Provider: SqlServer
      ConnectionStrings__Default: "Server=sqlserver,1433;Database=ClaimsDb;User Id=sa;Password=Your_strong_Passw0rd!;TrustServerCertificate=True"
      Kafka__Enabled: "true"
      Kafka__BootstrapServers: kafka:19092
      Seed__Enabled: "true"
      Storage__Path: /app/uploads
      Jwt__Key: "docker-compose-demo-key-change-me-0123456789abcdef"
      Cors__Origins__0: http://localhost:8081
    ports: ["5000:8080"]
    volumes: ["uploads:/app/uploads"]

  web:
    build: ./frontend
    depends_on: [api]
    ports: ["8081:80"]

volumes:
  sqldata:
  uploads:
